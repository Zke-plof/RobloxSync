<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F72B1C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)" />
  
  <!-- Roblox cube -->
  <g transform="translate(64,64) scale(0.8)">
    <!-- Top face -->
    <path d="M -20,-10 L 0,-20 L 20,-10 L 0,0 Z" fill="#FF6B35" stroke="#fff" stroke-width="2"/>
    <!-- Left face -->
    <path d="M -20,-10 L -20,10 L 0,20 L 0,0 Z" fill="#F72B1C" stroke="#fff" stroke-width="2"/>
    <!-- Right face -->
    <path d="M 0,0 L 0,20 L 20,10 L 20,-10 Z" fill="#E82020" stroke="#fff" stroke-width="2"/>
  </g>
  
  <!-- Sync arrows -->
  <g transform="translate(64,64)">
    <!-- Left arrow -->
    <path d="M -35,0 Q -40,-5 -35,-10 L -30,-5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-35" cy="-10" r="3" fill="#fff"/>
    
    <!-- Right arrow -->
    <path d="M 35,0 Q 40,5 35,10 L 30,5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="35" cy="10" r="3" fill="#fff"/>
    
    <!-- Top arrow -->
    <path d="M 0,-35 Q -5,-40 -10,-35 L -5,-30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-10" cy="-35" r="3" fill="#fff"/>
    
    <!-- Bottom arrow -->
    <path d="M 0,35 Q 5,40 10,35 L 5,30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="10" cy="35" r="3" fill="#fff"/>
  </g>
</svg>
